#Steam cycle: steam engine outlets
[steam]
	#mB/t of pressurized steam per boiler level an outlet engine draws (Create takes 10 mB/t of water per level)
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	steamPerBoilerLevel = 10.0

#Electro Energetics converter bridge to TFMG's electrical network
[electroenergetics]
	#EE watts exchanged per TFMG watt (both networks compute power as V·I, so 1.0 conserves energy)
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	eeWattsPerTfmgWatt = 1.0
	#°C a lit resistive heater pushes into the TFC heat consumer above it (a TFMG vat, a crucible) per unit of its heat; 1 heat is about 7.4 kW
	# Default: 1000.0
	# Range: 0.0 ~ 10000.0
	resistiveHeaterDegreesPerHeat = 1000.0
	#Highest °C a resistive heater can push, the limit of its heating element
	# Default: 1800.0
	# Range: 0.0 ~ 5000.0
	resistiveHeaterMaxTemperature = 1800.0

#ComputerCraft power: computers draw FE while on and shut down without it
[computers]
	#FE/t a running computer draws from its buffer
	# Default: 20
	# Range: 0 ~ 100000
	computerEnergyPerTick = 20
	#FE/t a running advanced computer draws from its buffer
	# Default: 40
	# Range: 0 ~ 100000
	advancedComputerEnergyPerTick = 40
	#FE a computer block can hold, filled from any FE source such as an EE converter
	# Default: 2000
	# Range: > 1
	computerBuffer = 2000
	#FE/t a running pocket computer draws from its battery
	# Default: 5
	# Range: 0 ~ 100000
	pocketComputerEnergyPerTick = 5
	#FE/t a running advanced pocket computer draws from its battery
	# Default: 10
	# Range: 0 ~ 100000
	advancedPocketComputerEnergyPerTick = 10
	#FE a pocket computer battery holds; charge it under a New Age energiser
	# Default: 360000
	# Range: > 1
	pocketComputerCapacity = 360000
	#FE an advanced pocket computer battery holds
	# Default: 720000
	# Range: > 1
	advancedPocketComputerCapacity = 720000
